<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JS + CSS Clock</title>
  <link rel="icon" href="https://fav.farm/🔥" />
</head>
<body>


    <div class="clock">
      <div class="clock-face">
        <div class="horizontal-line"></div>
        <div class="vertical-line"></div>
        <div class="circle"></div>
        <div class="hand hour-hand"></div>
        <div class="hand min-hand"></div>
        <div class="hand second-hand"></div>
      </div>
    </div>


  <style>
    html {
      background: #018DED url(https://unsplash.it/1500/1000?image=881&blur=5);
      background-size: cover;
      font-family: 'helvetica neue';
      text-align: center;
      font-size: 10px;
    }

    body {
      margin: 0;
      font-size: 2rem;
      display: flex;
      flex: 1;
      min-height: 100vh;
      align-items: center;
    }

    .clock {
      width: 30rem;
      height: 30rem;
      border: 20px solid white;
      border-radius: 50%;
      margin: 50px auto;
      position: relative;
      padding: 2rem;
      box-shadow:
        0 0 0 4px rgba(0,0,0,0.1),
        inset 0 0 0 3px #EFEFEF,
        inset 0 0 10px black,
        0 0 10px rgba(0,0,0,0.2);
    }

    .clock-face {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .horizontal-line {
      width: 0.2%;
      height: 100%;
      background: lightslategray;
      position: absolute;
      right: 50%;
      transform: rotate(90deg);
    }

    .vertical-line {
      width: 0.2%;
      height: 100%;
      background: lightslategray;
      position: absolute;
      right: 50%;
    }

    .circle {
      width: 5%;
      height: 5%;
      border-radius: 50%;
      border: 2px solid lightslategray;
      background-color: orange;
      position: absolute;
      top: 50%;
      left: 50%;
      translate: -50% -50%;
      z-index: 10;
    }

    .hand {
      width: 50%;
      height: 6px;
      background: black;
      position: absolute;
      top: 50%;
      right: 50%;
      translate: 0 -50%;
      transform-origin: right center;
      transform: rotate(90deg);
      transition: transform 0.5s cubic-bezier(0.1, 2.7, 0.58, 1);
    }

    .hour-hand {
      width: 30%;
    }

    .min-hand {
      width: 40%;
    }

    .second-hand {
      height: 3px;
    }

  </style>


  <script>
    const secondHand = document.querySelector(".second-hand");
    const minuteHand = document.querySelector(".min-hand");
    const hourHand = document.querySelector(".hour-hand");

    function setTransition(hand, shouldReset) {
      return hand.style.transition = shouldReset ? "none" : "";
    }

    function setClock() {
      const now = new Date();
      const seconds = now.getSeconds();
      const minutes = now.getMinutes();
      const hours = now.getHours();

      const isSecondReset = seconds === 0;
      const isMinuteReset = minutes === 0 && seconds === 0;
      const isHourReset = hours % 12 === 0 && minutes === 0;

      setTransition(secondHand, isSecondReset);
      setTransition(minuteHand, isMinuteReset);
      setTransition(hourHand, isHourReset);

      const CLOCK_HAND_OFFSET = 90; // 90 is a hand rotating offset
      const secondDegrees = ((seconds / 60) * 360) + CLOCK_HAND_OFFSET;
      const minuteDegrees = ((minutes / 60) * 360) + ((seconds / 60) * 6) + CLOCK_HAND_OFFSET;
      const hourDegrees = (((hours % 12) / 12) * 360) + ((minutes / 60) * 30) + CLOCK_HAND_OFFSET; // Use remainder operator to turn the outcome of getHours() from 24 into 12 hour format

      secondHand.style.transform = `rotate(${secondDegrees}deg)`; // Manipulate inline CSS style
      minuteHand.style.transform = `rotate(${minuteDegrees}deg)`;
      hourHand.style.transform = `rotate(${hourDegrees}deg)`;
    }

    setInterval(setClock, 1000);
  </script>
</body>
</html>
